      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk WarehouseTDM.apk
          gh release create "v${{ github.run_number }}" WarehouseTDM.apk --repo "${{ github.repository }}" --title "Warehouse TDM v${{ github.run_number }}" --notes "APK"
